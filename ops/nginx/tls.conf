# X-Science managed HTTPS site. UDP443 remains available for WireGuard.
server {
    listen 80;
    server_name x-science.ai xscience.si xsci.si www.x-science.ai www.xscience.si www.xsci.si;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/x-science/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 301 https://x-science.ai$request_uri;
    }
}
server {
    listen 443 ssl http2;
    server_name x-science.ai;
    root /var/www/x-science/current;
    include /etc/nginx/x-science/tls-settings.conf;
    include /etc/nginx/x-science/site-common.conf;
}
server {
    listen 443 ssl http2;
    server_name xscience.si xsci.si www.x-science.ai www.xscience.si www.xsci.si;
    include /etc/nginx/x-science/tls-settings.conf;
    return 301 https://x-science.ai$request_uri;
}
