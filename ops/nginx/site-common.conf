# X-Science managed static site settings.
index index.html;
charset utf-8;
server_tokens off;
access_log /var/log/nginx/x-science-access.log;
error_log /var/log/nginx/x-science-error.log warn;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header X-Frame-Options DENY always;
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; base-uri 'self'; frame-ancestors 'none'; form-action 'none'" always;
gzip on;
gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

location = /en {
    return 301 /$is_args$args;
}
location ^~ /en/ {
    rewrite ^/en/(.*)$ /$1 permanent;
}

# Preserve bookmarks after the research agent's X-Science rename.
location ~ ^/products/synon-biomed/?$ {
    return 301 /products/x-science/$is_args$args;
}
location ~ ^/(zh|ja|de|fr|ko)/products/synon-biomed/?$ {
    return 301 /$1/products/x-science/$is_args$args;
}

location / {
    try_files $uri $uri/ =404;
}
location ^~ /_transfer/ {
    return 404;
}
location ~ /\. {
    deny all;
}
error_page 404 /404.html;
location = /404.html {
    internal;
}
