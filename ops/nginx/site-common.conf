# X-Science managed static site settings.
index index.html;
charset utf-8;
server_tokens off;
access_log /var/log/nginx/x-science-access.log;
error_log /var/log/nginx/x-science-error.log warn;
add_header X-Content-Type-Options nosniff always;
set $x_science_cache "no-cache";
if ($uri ~ "^/assets/build/[^/]+-[A-Za-z0-9]{8,16}\.[a-z0-9]+$") {
    set $x_science_cache "public, max-age=31536000, immutable";
}
add_header Cache-Control $x_science_cache always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header X-Frame-Options DENY always;
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; worker-src 'self' blob:; base-uri 'self'; frame-ancestors 'none'; form-action 'none'" always;
gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_types text/css text/javascript application/javascript application/json image/svg+xml chemical/x-pdb;

# Immutable assets shared across retained releases keep already-open pages working.
location ^~ /assets/build/ {
    root /var/www/x-science/shared;
    types {
        application/javascript js;
        text/css css;
        font/woff2 woff2;
        image/png png;
        image/webp webp;
        image/svg+xml svg;
        chemical/x-pdb pdb;
    }
    try_files $uri =404;
}

# PDB coordinates are text, not the legacy Palm database type in nginx mime.types.
location ~ "^/assets/(structures/[A-Z0-9]{4}|build/[A-Z0-9]{4}-[a-f0-9]{16})\.pdb$" {
    types { chemical/x-pdb pdb; }
    try_files $uri =404;
}

location = /en {
    return 301 /$is_args$args;
}
location ^~ /en/ {
    rewrite ^/en/(.*)$ /$1 permanent;
}

# Preserve bookmarks after the research agent's X-Science rename.
location ~ ^/products/synon-biomed/?$ {
    return 301 /products/x-science/$is_args$args;
}
location ~ ^/(zh|ja|de|fr|ko)/products/synon-biomed/?$ {
    return 301 /$1/products/x-science/$is_args$args;
}

location / {
    try_files $uri $uri/ =404;
}
location ^~ /_transfer/ {
    return 404;
}
location ~ /\. {
    deny all;
}
error_page 404 /404.html;
location = /404.html {
    internal;
}
