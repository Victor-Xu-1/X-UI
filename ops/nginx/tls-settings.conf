# X-Science managed TLS settings, shared by the primary and brand redirects.
ssl_certificate /etc/letsencrypt/live/x-science.ai/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/x-science.ai/privkey.pem;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_session_cache shared:XScienceTLS:10m;
ssl_session_timeout 1d;
