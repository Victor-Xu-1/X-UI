# X-Science managed HTTP bootstrap; replace with tls.conf after ACME issuance.
server {
    listen 80;
    server_name x-science.ai xscience.si xsci.si www.x-science.ai www.xscience.si www.xsci.si 174.137.49.222;
    root /var/www/x-science/current;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/x-science/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    include /etc/nginx/x-science/site-common.conf;
}
